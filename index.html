// ============================================================
// SECTION 2: Audio Engine
// ============================================================
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.initialized = false;
  }
  init() {
    if (this.initialized) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.initialized = true;
    } catch(e) { this.enabled = false; }
  }
  play(freq, dur, type='square', vol=0.15) {
    if (!this.ctx || !this.enabled) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + dur + 0.05);
    } catch(e) {}
  }
  jump() { this.play(380, 0.08, 'square', 0.12); }
  collect() { this.play(880, 0.1, 'sine', 0.18); setTimeout(()=>this.play(1100,0.1,'sine',0.18),60); }
  die() { this.play(120, 0.35, 'sawtooth', 0.2); }
  door() { this.play(600, 0.15, 'triangle', 0.18); }
  complete() {
    this.play(523,0.12,'sine',0.2);
    setTimeout(()=>this.play(659,0.12,'sine',0.2),120);
    setTimeout(()=>this.play(784,0.25,'sine',0.25),240);
  }
  menu() { this.play(440,0.1,'sine',0.1); }
}

// ============================================================
// SECTION 3: Input Handler
// ============================================================
class InputHandler {
  constructor() {
    this.keys = new Set();
    this.justPressed = new Set();
    this.touches = {};
    this._onKD = this._onKD.bind(this);
    this._onKU = this._onKU.bind(this);
    this._onTS = this._onTS.bind(this);
    this._onTE = this._onTE.bind(this);
    this._onTM = this._onTM.bind(this);
    window.addEventListener('keydown', this._onKD);
    window.addEventListener('keyup', this._onKU);
    canvas.addEventListener('touchstart', this._onTS, {passive:false});
    canvas.addEventListener('touchend', this._onTE, {passive:false});
    canvas.addEventListener('touchmove', this._onTM, {passive:false});
    canvas.addEventListener('mousedown', e => { this._audioInit(); });
    canvas.addEventListener('click', e => { this._audioInit(); });
  }
  _audioInit() { /* handled by audio engine directly */ }
  _onKD(e) {
    if (!this.keys.has(e.code)) this.justPressed.add(e.code);
    this.keys.add(e.code);
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  }
  _onKU(e) { this.keys.delete(e.code); }
  _onTS(e) {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const rect = canvas.getBoundingClientRect();
      const sx = LOGICAL_W / rect.width;
      const sy = LOGICAL_H / rect.height;
      const tx = (t.clientX - rect.left) * sx;
      const ty = (t.clientY - rect.top) * sy;
      this.touches[t.identifier] = { x: tx, y: ty, startX: tx, startY: ty };
    }
  }
  _onTE(e) {
    for (const t of e.changedTouches) delete this.touches[t.identifier];
  }
  _onTM(e) {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (!this.touches[t.identifier]) continue;
      const rect = canvas.getBoundingClientRect();
      const sx = LOGICAL_W / rect.width;
      const sy = LOGICAL_H / rect.height;
      this.touches[t.identifier].x = (t.clientX - rect.left) * sx;
      this.touches[t.identifier].y = (t.clientY - rect.top) * sy;
    }
  }
  isDown(code) { return this.keys.has(code); }
  wasPressed(code) { return this.justPressed.has(code); }
  clearJustPressed() { this.justPressed.clear(); }

  // Mobile virtual controls: Yier (left half), Bubu (right half)
  getYierInput() {
    let l=false, r=false, u=false, d=false;
    for (const id in this.touches) {
      const t = this.touches[id];
      if (t.x < LOGICAL_W / 2) {
        // Left half = Yier's controls (d-pad on left)
        const cx = LOGICAL_W / 4, cy = LOGICAL_H * 0.65;
        const dx = t.x - cx, dy = t.y - cy;
        if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
          if (Math.abs(dx) > Math.abs(dy)) { l = dx < -20; r = dx > 20; }
          else { u = dy < -20; d = dy > 20; }
        }
      }
    }
    return { l, r, u, d };
  }
  getBubuInput() {
    let l=false, r=false, u=false, d=false;
    for (const id in this.touches) {
      const t = this.touches[id];
      if (t.x >= LOGICAL_W / 2) {
        const cx = LOGICAL_W * 3 / 4, cy = LOGICAL_H * 0.65;
        const dx = t.x - cx, dy = t.y - cy;
        if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
          if (Math.abs(dx) > Math.abs(dy)) { l = dx < -20; r = dx > 20; }
          else { u = dy < -20; d = dy > 20; }
        }
      }
    }
    return { l, r, u, d };
  }
  hasTouchInput() { return Object.keys(this.touches).length > 0; }
}

// ============================================================
// SECTION 4: Particle System
// ============================================================
class Particle {
  constructor(x, y, vx, vy, life, color, size=2) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life; this.color = color; this.size = size;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.15;
    this.life--;
    this.size *= 0.99;
  }
  get alpha() { return this.life / this.maxLife; }
  get alive() { return this.life > 0; }
}

function spawnParticles(parts, x, y, count, color, spread=3, life=25, size=2) {
  for (let i=0; i<count; i++) {
    const vx = (Math.random()-0.5)*spread*2;
    const vy = (Math.random()-0.7)*spread*3;
    parts.push(new Particle(x, y, vx, vy, life+Math.random()*10, color, size+Math.random()*2));
  }
}

// ============================================================
// SECTION 5: Player Class
// ============================================================
class Player {
  constructor(name, element, x, y) {
    this.name = name;
    this.element = element; // 'water' or 'fire'
    this.spawnX = x;
    this.spawnY = y;
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.w = element==='water'?22:28;
    this.h = element==='water'?34:32;
    this.onGround = false;
    this.alive = true;
    this.gems = 0;
    this.atDoor = false;
    this.coyoteTimer = 0;
    this.facingRight = true;
    this.animFrame = 0;
    this.idleTimer = 0;
  }

  respawn() {
    this.x = this.spawnX;
    this.y = this.spawnY;
    this.vx = 0;
    this.vy = 0;
    this.alive = true;
    this.atDoor = false;
    this.onGround = false;
    this.coyoteTimer = 0;
    this.gems = 0;
  }

  update(map, otherPlayer, input, parts) {
    if (!this.alive) return;

    // Input
    let left=false, right=false, up=false;
    if (this.element === 'water') {
      left = input.isDown('KeyA'); right = input.isDown('KeyD');
      up = input.wasPressed('KeyW');
      if (!left&&!right&&!up) {
        const yi = input.getYierInput();
        left=yi.l; right=yi.r; up=yi.u;
        if (yi.u) up=true;
      }
    } else {
      left = input.isDown('ArrowLeft'); right = input.isDown('ArrowRight');
      up = input.wasPressed('ArrowUp');
      if (!left&&!right&&!up) {
        const bi = input.getBubuInput();
        left=bi.l; right=bi.r; up=bi.u;
        if (bi.u) up=true;
      }
    }

    // Horizontal movement
    if (left) { this.vx -= 0.8; this.facingRight = false; }
    if (right) { this.vx += 0.8; this.facingRight = true; }
    if (!left && !right) this.vx *= FRICTION;
    this.vx = Math.max(-MAX_SPEED_X, Math.min(MAX_SPEED_X, this.vx));

    // Jump with coyote time
    if (this.coyoteTimer > 0) this.coyoteTimer--;
    if (up && (this.onGround || this.coyoteTimer > 0)) {
      this.vy = JUMP_VEL;
      this.onGround = false;
      this.coyoteTimer = 0;
      spawnParticles(parts, this.x+this.w/2, this.y+this.h, 5, this.element==='water'?'#aaddff':'#ffaa66', 2, 12, 1.5);
    }
    if (up && this.onGround) { this.vy = JUMP_VEL; this.onGround = false; this.coyoteTimer = 0; }

    // Gravity
    this.vy += GRAVITY;
    this.vy = Math.min(this.vy, MAX_SPEED_Y);

    // Move X then Y
    this._moveX(map, otherPlayer, parts);
    this._moveY(map, otherPlayer, parts);

    // Check if fell off map
    if (this.y > map.pixelH + 100) this._die(parts);

    // Coyote time start
    if (!this.onGround && this.coyoteTimer === 0) {
      // Check if was just on ground
    }
    if (this.onGround) this.coyoteTimer = COYOTE_FRAMES;

    // Animation
    if (!this.onGround) this.animFrame += 0.15;
    else if (left || right) this.animFrame += 0.2;
    else { this.animFrame = 0; this.idleTimer++; }
    this.idleTimer++;
  }

  _moveX(map, otherPlayer, parts) {
    this.x += this.vx;
    const left = Math.floor(this.x / TILE);
    const right = Math.floor((this.x + this.w - 1) / TILE);
    const top = Math.floor(this.y / TILE);
    const bottom = Math.floor((this.y + this.h - 1) / TILE);

    // Wall collision
    for (let row = top; row <= bottom; row++) {
      for (let col = left; col <= right; col++) {
        const t = map.getTile(col, row);
        if (this._isSolid(t, map, col, row)) {
          if (this.vx > 0) this.x = col * TILE - this.w;
          else if (this.vx < 0) this.x = (col + 1) * TILE;
          this.vx = 0;
        }
      }
    }

    // Push block collision & pushing
    for (const blk of map.pushBlocks) {
      if (!blk.active) continue;
      if (!this._overlap(blk)) continue;
      const dir = this.vx > 0 ? 1 : -1;
      const pushDist = 2;
      const newBX = blk.x + dir * pushDist;
      const bLeft = Math.floor(newBX / TILE);
      const bRight = Math.floor((newBX + blk.w - 1) / TILE);
      const bTop = Math.floor(blk.y / TILE);
      const bBottom = Math.floor((blk.y + blk.h - 1) / TILE);
      let blocked = false;
      for (let r=bTop; r<=bBottom; r++)
        for (let c=bLeft; c<=bRight; c++)
          if (this._isSolid(map.getTile(c,r), map, c, r)) { blocked=true; break; }
      // Also check other push blocks
      for (const ob of map.pushBlocks) {
        if (ob===blk || !ob.active) continue;
        if (newBX < ob.x+ob.w && newBX+blk.w > ob.x && blk.y < ob.y+ob.h && blk.y+blk.h > ob.y) { blocked=true; break; }
      }
      if (blocked) {
        // Stop player
        if (this.vx > 0) this.x = blk.x - this.w;
        else if (this.vx < 0) this.x = blk.x + blk.w;
        this.vx = 0;
      } else {
        blk.x += dir * pushDist;
        // Apply push block gravity after move
        blk.y += 0.5;
        const bbtm = Math.floor((blk.y+blk.h-1)/TILE);
        for (let c=Math.floor(blk.x/TILE); c<=Math.floor((blk.x+blk.w-1)/TILE); c++)
          if (this._isSolid(map.getTile(c,bbtm+1), map, c, bbtm+1)) { blk.y -= 0.5; break; }
      }
    }
  }

  _moveY(map, otherPlayer, parts) {
    this.y += this.vy;
    this.onGround = false;
    const left = Math.floor(this.x / TILE);
    const right = Math.floor((this.x + this.w - 1) / TILE);
    const top = Math.floor(this.y / TILE);
    const bottom = Math.floor((this.y + this.h - 1) / TILE);

    // Wall collision
    for (let row = top; row <= bottom; row++) {
      for (let col = left; col <= right; col++) {
        const t = map.getTile(col, row);
        if (this._isSolid(t, map, col, row)) {
          if (this.vy > 0) { this.y = row * TILE - this.h; this.onGround = true; this.vy = 0; }
          else if (this.vy < 0) { this.y = (row + 1) * TILE; this.vy = 0; }
        }
      }
    }

    // Push block vertical collision (stand on or bump head)
    for (const blk of map.pushBlocks) {
      if (!blk.active) continue;
      if (this.x + this.w <= blk.x || this.x >= blk.x + blk.w) continue;
      if (this.vy > 0 && this.y + this.h >= blk.y && this.y + this.h - this.vy <= blk.y + 2) {
        this.y = blk.y - this.h;
        this.onGround = true;
        this.vy = 0;
      } else if (this.vy < 0 && this.y <= blk.y + blk.h && this.y - this.vy >= blk.y + blk.h - 2) {
        this.y = blk.y + blk.h;
        this.vy = 0;
      }
    }

    // Hazard checks
    const hTop = Math.floor(this.y / TILE);
    const hBottom = Math.floor((this.y + this.h - 1) / TILE);
    const hLeft = Math.floor(this.x / TILE);
    const hRight = Math.floor((this.x + this.w - 1) / TILE);
    for (let row = hTop; row <= hBottom; row++) {
      for (let col = hLeft; col <= hRight; col++) {
        const t = map.getTile(col, row);
        if (t === WATER_T && this.element === 'fire') this._die(parts);
        if (t === LAVA_T && this.element === 'water') this._die(parts);
        if (t === ACID_T) this._die(parts);
      }
    }
  }

  _isSolid(t, map, col, row) {
    if (t === WALL || t === PUSH_BLOCK_T) return true;
    if (t === GATE_T && map.gates) {
      const g = map.gates.find(g=>g.col===col&&g.row===row);
      if (g && !g.open) return true;
    }
    return false;
  }

  _overlap(blk) {
    return this.x < blk.x + blk.w && this.x + this.w > blk.x &&
           this.y < blk.y + blk.h && this.y + this.h > blk.y;
  }

  _die(parts) {
    if (!this.alive) return;
    this.alive = false;
    spawnParticles(parts, this.x+this.w/2, this.y+this.h/2, 20,
      this.element==='water'?'#aaddff':'#ff6633', 4, 30, 3);
  }

  render(ctx, cam, time) {
    if (!this.alive) return;
    const sx = this.x - cam.x;
    const sy = this.y - cam.y;
    if (sx < -50 || sx > cam.width+50 || sy < -50 || sy > cam.height+50) return;

    ctx.save();
    ctx.translate(sx + this.w/2, sy + this.h/2);
    if (this.element === 'water') this._drawYier(ctx, time);
    else this._drawBubu(ctx, time);
    ctx.restore();
  }

  _drawYier(ctx, time) {
    const breathe = 1 + Math.sin(time * 0.003 + this.idleTimer * 0.02) * 0.03;
    ctx.scale(breathe, breathe);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(0, this.h/2 - 2, 10, 3, 0, 0, Math.PI*2); ctx.fill();

    // Legs
    ctx.fillStyle = C.YIER_BLACK;
    this._roundRect(ctx, -7, this.h/2-9, 5, 9, 2);
    this._roundRect(ctx, 2, this.h/2-9, 5, 9, 2);

    // Body (white ellipse)
    ctx.fillStyle = C.YIER_BODY;
    ctx.beginPath(); ctx.ellipse(0, 0, 10, 14, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 10, 14, 0, 0, Math.PI*2); ctx.stroke();

    // Arms
    ctx.fillStyle = C.YIER_BODY;
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.5;
    const armSwing = Math.sin(this.animFrame) * 3;
    ctx.save(); ctx.translate(-11, -3+armSwing);
    ctx.beginPath(); ctx.ellipse(0, 0, 3.5, 7, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.translate(11, -3-armSwing);
    ctx.beginPath(); ctx.ellipse(0, 0, 3.5, 7, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();

    // Ears (black circles at top)
    ctx.fillStyle = C.YIER_BLACK;
    ctx.beginPath(); ctx.arc(-7, -13, 5.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -13, 5.5, 0, Math.PI*2); ctx.fill();

    // Head
    ctx.fillStyle = C.YIER_BODY;
    ctx.beginPath(); ctx.arc(0, -4, 11.5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.arc(0, -4, 11.5, 0, Math.PI*2); ctx.stroke();

    // Eye patches (panda markings)
    ctx.fillStyle = C.YIER_BLACK;
    ctx.beginPath(); ctx.ellipse(-4.5, -7, 3.5, 4.5, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4.5, -7, 3.5, 4.5, 0.2, 0, Math.PI*2); ctx.fill();

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4.5, -7.5, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4.5, -7.5, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-4, -7.5, 1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -7.5, 1, 0, Math.PI*2); ctx.fill();

    // Nose
    ctx.fillStyle = C.YIER_BLACK;
    ctx.beginPath(); ctx.arc(0, -3.5, 1.2, 0, Math.PI*2); ctx.fill();

    // Mouth
    ctx.strokeStyle = C.YIER_BLACK; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(0, -2, 2, 0.1, Math.PI-0.1); ctx.stroke();

    // Bow tie
    ctx.fillStyle = C.YIER_BOW;
    ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(-5, 2); ctx.lineTo(-5, 8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(5, 2); ctx.lineTo(5, 8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 5, 1.8, 0, Math.PI*2); ctx.fill();

    // Element glow
    ctx.fillStyle = 'rgba(100,180,255,0.25)';
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI*2); ctx.fill();
  }

  _drawBubu(ctx, time) {
    const breathe = 1 + Math.sin(time * 0.003 + this.idleTimer * 0.02) * 0.03;
    ctx.scale(breathe, breathe);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(0, this.h/2 - 2, 12, 3.5, 0, 0, Math.PI*2); ctx.fill();

    // Legs (thicker)
    ctx.fillStyle = C.BUBU_DARK;
    this._roundRect(ctx, -9, this.h/2-8, 7, 8, 2.5);
    this._roundRect(ctx, 2, this.h/2-8, 7, 8, 2.5);

    // Body (brown, wider)
    ctx.fillStyle = C.BUBU_BODY;
    ctx.beginPath(); ctx.ellipse(0, -1, 13.5, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = C.BUBU_DARK; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.ellipse(0, -1, 13.5, 13, 0, 0, Math.PI*2); ctx.stroke();

    // Belly patch
    ctx.fillStyle = C.BUBU_BELLY;
    ctx.beginPath(); ctx.ellipse(0, 2, 8, 7.5, 0, 0, Math.PI*2); ctx.fill();

    // Arms
    ctx.fillStyle = C.BUBU_BODY;
    ctx.strokeStyle = C.BUBU_DARK; ctx.lineWidth = 0.5;
    const armSwing = Math.sin(this.animFrame) * 2.5;
    ctx.save(); ctx.translate(-14, -1+armSwing);
    this._roundRect(ctx, -2, -3, 5.5, 8.5, 2.5);
    ctx.restore();
    ctx.save(); ctx.translate(14, -1-armSwing);
    this._roundRect(ctx, -3.5, -3, 5.5, 8.5, 2.5);
    ctx.restore();

    // Ears
    ctx.fillStyle = C.BUBU_BODY;
    ctx.beginPath(); ctx.arc(-9, -13, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -13, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = C.BUBU_EAR_INNER;
    ctx.beginPath(); ctx.arc(-9, -13, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -13, 3.5, 0, Math.PI*2); ctx.fill();

    // Head (larger)
    ctx.fillStyle = C.BUBU_BODY;
    ctx.beginPath(); ctx.arc(0, -5, 13.5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = C.BUBU_DARK; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.arc(0, -5, 13.5, 0, Math.PI*2); ctx.stroke();

    // Snout
    ctx.fillStyle = C.BUBU_SNOUT;
    ctx.beginPath(); ctx.ellipse(0, -1, 7, 6, 0, 0, Math.PI*2); ctx.fill();

    // Nose
    ctx.fillStyle = C.BUBU_NOSE;
    ctx.beginPath(); ctx.ellipse(0, -3, 2.8, 2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(-0.8, -3.8, 0.8, 0, Math.PI*2); ctx.fill();

    // Eyes
    ctx.fillStyle = C.BUBU_NOSE;
    ctx.beginPath(); ctx.arc(-5, -8, 1.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -8, 1.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4.5, -8.5, 0.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5.5, -8.5, 0.6, 0, Math.PI*2); ctx.fill();

    // Blush
    ctx.fillStyle = C.BUBU_BLUSH;
    ctx.beginPath(); ctx.ellipse(-8.5, -3, 3.5, 2.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8.5, -3, 3.5, 2.5, 0, 0, Math.PI*2); ctx.fill();

    // Mouth
    ctx.strokeStyle = C.BUBU_DARK; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.arc(0, 1.5, 3, 0.1, Math.PI-0.1); ctx.stroke();

    // Element glow
    ctx.fillStyle = 'rgba(255,140,50,0.2)';
    ctx.beginPath(); ctx.arc(0, -2, 18, 0, Math.PI*2); ctx.fill();
  }

  _roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
    ctx.arcTo(x+w, y, x+w, y+r, r);
    ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
    ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
    ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
    ctx.closePath(); ctx.fill();
  }
}

// ============================================================
// SECTION 6: Map/Level Class
// ============================================================
class GameMap {
  constructor(levelData) {
    this.w = levelData.w;
    this.h = levelData.h;
    this.pixelW = this.w * TILE;
    this.pixelH = this.h * TILE;
    this.tiles = [];
    this.gems = [];
    this.doors = [];
    this.spawnYier = { x: 0, y: 0 };
    this.spawnBubu = { x: 0, y: 0 };
    this.pushBlocks = [];
    this.levers = [];
    this.gates = [];
    this.movingPlatforms = [];

    // Parse map
    for (let row = 0; row < this.h; row++) {
      this.tiles[row] = [];
      const line = levelData.map[row] || '';
      for (let col = 0; col < this.w; col++) {
        const ch = col < line.length ? line[col] : ' ';
        const t = CHAR_MAP[ch] || AIR;
        this.tiles[row][col] = t;

        const px = col * TILE + TILE/2;
        const py = row * TILE + TILE/2;

        switch (t) {
          case SPAWN_YIER:
            this.spawnYier = { x: col*TILE, y: row*TILE };
            this.tiles[row][col] = AIR;
            break;
          case SPAWN_BUBU:
            this.spawnBubu = { x: col*TILE, y: row*TILE };
            this.tiles[row][col] = AIR;
            break;
          case BLUE_GEM:
            this.gems.push({ x: px-8, y: py-8, w:16, h:16, type:'blue', collected:false });
            this.tiles[row][col] = AIR;
            break;
          case RED_GEM:
            this.gems.push({ x: px-8, y: py-8, w:16, h:16, type:'red', collected:false });
            this.tiles[row][col] = AIR;
            break;
          case DOOR_YIER:
            this.doors.push({ x: col*TILE, y: row*TILE, w:TILE, h:TILE, type:'yier', active:false });
            this.tiles[row][col] = AIR; // keep rendering
            break;
          case DOOR_BUBU:
            this.doors.push({ x: col*TILE, y: row*TILE, w:TILE, h:TILE, type:'bubu', active:false });
            this.tiles[row][col] = AIR;
            break;
          case MOVE_PLAT_H:
            this.movingPlatforms.push({ x: col*TILE, y: row*TILE, w:TILE, h:12, type:'h',
              startX: col*TILE, endX: col*TILE + TILE*2, speed: 1.5, dir: 1 });
            this.tiles[row][col] = AIR;
            break;
          case MOVE_PLAT_V:
            this.movingPlatforms.push({ x: col*TILE, y: row*TILE, w:TILE, h:12, type:'v',
              startY: row*TILE, endY: row*TILE + TILE*3, speed: 1, dir: 1 });
            this.tiles[row][col] = AIR;
            break;
          case PUSH_BLOCK_T:
            this.pushBlocks.push({ x: col*TILE+2, y: row*TILE+2, w:TILE-4, h:TILE-4, active:true });
            this.tiles[row][col] = AIR;
            break;
          case LEVER_T:
            this.levers.push({ x: col*TILE, y: row*TILE, w:TILE, h:TILE, activated:false, linkedGate:null });
            this.tiles[row][col] = AIR;
            break;
          case GATE_T:
            this.gates.push({ x: col*TILE, y: row*TILE, w:TILE, h:TILE, col, row, open:false });
            this.tiles[row][col] = AIR;
            break;
        }
      }
    }

    // Link levers to gates (simple: each lever opens nearest unlinked gate)
    this.gates.forEach((g, i) => {
      if (i < this.levers.length) this.levers[i].linkedGate = i;
    });
  }

  getTile(col, row) {
    if (col < 0 || col >= this.w || row < 0 || row >= this.h) return WALL;
    // Check door tiles stored in array
    for (const d of this.doors) {
      if (Math.floor(d.x/TILE) === col && Math.floor(d.y/TILE) === row) return AIR;
    }
    return this.tiles[row]?.[col] ?? AIR;
  }

  hasDoorTile(col, row) {
    for (const d of this.doors) {
      if (Math.floor(d.x/TILE) === col && Math.floor(d.y/TILE) === row) return d;
    }
    return null;
  }

  update(time, players, parts) {
    // Update moving platforms
    for (const mp of this.movingPlatforms) {
      const prevX = mp.x, prevY = mp.y;
      if (mp.type === 'h') {
        mp.x += mp.speed * mp.dir;
        if (mp.x >= mp.endX || mp.x <= mp.startX) mp.dir *= -1;
      } else {
        mp.y += mp.speed * mp.dir;
        if (mp.y >= mp.endY || mp.y <= mp.startY) mp.dir *= -1;
      }
      // Carry players standing on platform
      for (const p of players) {
        if (!p.alive) continue;
        const standingOn = p.y + p.h >= prevY - 2 && p.y + p.h <= prevY + 4 &&
                           p.x + p.w > prevX + 4 && p.x < prevX + mp.w - 4;
        if (standingOn) {
          p.x += mp.x - prevX;
          p.y += mp.y - prevY;
        }
      }
    }

    // Update levers
    for (const lv of this.levers) {
      lv.activated = false;
      for (const p of players) {
        if (!p.alive) continue;
        if (p.x + p.w > lv.x && p.x < lv.x + lv.w &&
            p.y + p.h > lv.y + TILE/2 && p.y < lv.y + lv.h) {
          lv.activated = true;
        }
      }
      if (lv.linkedGate !== null && this.gates[lv.linkedGate]) {
        this.gates[lv.linkedGate].open = lv.activated;
      }
    }

    // Check gem collection
    for (const gem of this.gems) {
      if (gem.collected) continue;
      const target = gem.type === 'blue' ? players[0] : players[1];
      if (!target.alive) continue;
      const gcx = gem.x + gem.w/2, gcy = gem.y + gem.h/2;
      const pcx = target.x + target.w/2, pcy = target.y + target.h/2;
      if (Math.abs(gcx-pcx) < 20 && Math.abs(gcy-pcy) < 24) {
        gem.collected = true;
        target.gems++;
      }
    }

    // Check door arrival
    for (const d of this.doors) {
      const target = d.type === 'yier' ? players[0] : players[1];
      if (!target.alive) continue;
      const dcx = d.x + d.w/2, dcy = d.y + d.h/2;
      const pcx = target.x + target.w/2, pcy = target.y + target.h/2;
      if (Math.abs(dcx-pcx) < 18 && Math.abs(dcy-pcy) < 22) {
        d.active = true;
        if (d.type === 'yier') players[0].atDoor = true;
        else players[1].atDoor = true;
      } else {
        if (d.type === 'yier') players[0].atDoor = false;
        else players[1].atDoor = false;
      }
    }
  }

  render(ctx, cam, time) {
    const startCol = Math.max(0, Math.floor(cam.x / TILE) - 1);
    const endCol = Math.min(this.w, Math.floor((cam.x + cam.width) / TILE) + 1);
    const startRow = Math.max(0, Math.floor(cam.y / TILE) - 1);
    const endRow = Math.min(this.h, Math.floor((cam.y + cam.height) / TILE) + 1);

    for (let row = startRow; row < endRow; row++) {
      for (let col = startCol; col < endCol; col++) {
        const t = this.tiles[row]?.[col] ?? WALL;
        const x = col * TILE - cam.x;
        const y = row * TILE - cam.y;
        if (x < -TILE || x > cam.width + TILE || y < -TILE || y > cam.height + TILE) continue;

        this._renderTile(ctx, x, y, t, time);
      }
    }

    // Render door tiles on top
    for (const d of this.doors) {
      const x = d.x - cam.x, y = d.y - cam.y;
      this._renderDoor(ctx, x, y, d, time);
    }

    // Render push blocks
    for (const blk of this.pushBlocks) {
      if (!blk.active) continue;
      const x = blk.x - cam.x, y = blk.y - cam.y;
      ctx.fillStyle = C.PUSH_BLOCK;
      ctx.fillRect(x, y, blk.w, blk.h);
      ctx.strokeStyle = C.PUSH_BLOCK_LINE; ctx.lineWidth = 1.5;
      ctx.strokeRect(x, y, blk.w, blk.h);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+blk.w, y+blk.h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+blk.w, y); ctx.lineTo(x, y+blk.h); ctx.stroke();
    }

    // Render moving platforms
    for (const mp of this.movingPlatforms) {
      const x = mp.x - cam.x, y = mp.y - cam.y;
      ctx.fillStyle = C.PLATFORM;
      ctx.fillRect(x, y, mp.w, mp.h);
      ctx.fillStyle = '#aa9'; ctx.fillRect(x, y, mp.w, 3);
      // Direction arrow
      ctx.fillStyle = '#fff';
      if (mp.type==='h') {
        ctx.beginPath(); ctx.moveTo(x+mp.w/2, y+mp.h/2); ctx.lineTo(x+mp.w/2-4, y+mp.h/2-3); ctx.lineTo(x+mp.w/2-4, y+mp.h/2+3); ctx.fill();
      }
    }

    // Render gems
    for (const gem of this.gems) {
      if (gem.collected) continue;
      const x = gem.x - cam.x, y = gem.y - cam.y;
      this._renderGem(ctx, x, y, gem, time);
    }

    // Render levers
    for (const lv of this.levers) {
      const x = lv.x - cam.x, y = lv.y - cam.y;
      ctx.fillStyle = C.LEVER_BASE; ctx.fillRect(x+10, y+TILE-8, TILE-20, 8);
      ctx.fillStyle = lv.activated ? '#0f0' : C.LEVER_STICK;
      const stickAngle = lv.activated ? -0.5 : 0.5;
      ctx.save(); ctx.translate(x+TILE/2, y+TILE-8);
      ctx.rotate(stickAngle);
      ctx.fillRect(-3, -16, 6, 16);
      ctx.restore();
    }

    // Render gates
    for (const g of this.gates) {
      const x = g.x - cam.x, y = g.y - cam.y;
      if (!g.open) {
        ctx.fillStyle = C.GATE_BAR;
        for (let i=0; i<5; i++) {
          ctx.fillRect(x+4+i*7, y+4, 4, TILE-8);
        }
      } else {
        ctx.strokeStyle = '#4a4';
        ctx.lineWidth = 1;
        ctx.setLineDash([4,4]);
        ctx.strokeRect(x+2, y+2, TILE-4, TILE-4);
        ctx.setLineDash([]);
      }
    }
  }

  _renderTile(ctx, x, y, t, time) {
    switch (t) {
      case WALL:
        ctx.fillStyle = C.WALL;
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = C.WALL_TOP;
        ctx.fillRect(x, y, TILE, 3);
        ctx.fillStyle = C.WALL_SHADOW;
        ctx.fillRect(x, y+TILE-2, TILE, 2);
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(x+0.5, y+0.5, TILE-1, TILE-1);
        break;
      case WATER_T:
        const wAlpha = 0.55 + Math.sin(time*0.004 + x*0.05) * 0.12;
        ctx.fillStyle = `rgba(30,144,255,${wAlpha})`;
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = C.WATER_SURF;
        ctx.fillRect(x, y, TILE, 4 + Math.sin(time*0.006 + x*0.03) * 2);
        // Wave lines
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let wx=0; wx<TILE; wx+=2) {
          const wy = y + 10 + Math.sin(time*0.005 + (x+wx)*0.06) * 4;
          if (wx===0) ctx.moveTo(x+wx, wy); else ctx.lineTo(x+wx, wy);
        }
        ctx.stroke();
        break;
      case LAVA_T:
        const lAlpha = 0.6 + Math.sin(time*0.006 + x*0.04) * 0.15;
        ctx.fillStyle = `rgba(255,69,0,${lAlpha})`;
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = C.LAVA_GLOW;
        ctx.fillRect(x, y, TILE, 4 + Math.sin(time*0.008 + x*0.05) * 3);
        // Bubble particles
        for (let b=0; b<2; b++) {
          const bx = x + 8 + b*20 + Math.sin(time*0.01+b*3) * 6;
          const by = y + 15 + Math.sin(time*0.015+b*2) * 8;
          ctx.fillStyle = 'rgba(255,200,50,0.5)';
          ctx.beginPath(); ctx.arc(bx, by, 2, 0, Math.PI*2); ctx.fill();
        }
        break;
      case ACID_T:
        ctx.fillStyle = `rgba(50,205,50,0.55)`;
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = C.ACID_GLOW;
        ctx.fillRect(x, y, TILE, 3);
        break;
      default:
        // Air - subtle grid lines
        break;
    }
  }

  _renderDoor(ctx, x, y, d, time) {
    const pulse = 1 + Math.sin(time*0.005) * 0.08;
    const glow = d.active ? 15 : 8;
    ctx.save();
    ctx.shadowColor = d.type==='yier'?C.DOOR_BLUE:C.DOOR_RED;
    ctx.shadowBlur = glow;
    ctx.fillStyle = d.type==='yier'?C.DOOR_BLUE:C.DOOR_RED;
    ctx.fillRect(x+6, y+4, TILE-12, TILE-8);
    ctx.fillStyle = d.type==='yier'?'#2a60b0':'#a03020';
    ctx.fillRect(x+10, y+8, TILE-20, TILE-16);
    // Arch
    ctx.fillStyle = d.type==='yier'?C.DOOR_BLUE:C.DOOR_RED;
    ctx.beginPath(); ctx.arc(x+TILE/2, y+20, TILE/2-6, Math.PI, 0); ctx.fill();
    if (d.active) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✓', x+TILE/2, y+TILE/2+4);
    }
    ctx.restore();
  }

  _renderGem(ctx, x, y, gem, time) {
    const rot = time * 0.003;
    const pulse = 1 + Math.sin(time*0.005 + gem.x) * 0.15;
    ctx.save();
    ctx.translate(x+gem.w/2, y+gem.h/2);
    ctx.rotate(rot);
    ctx.scale(pulse, pulse);

    // Diamond shape
    ctx.fillStyle = gem.type==='blue'?C.BLUE_GEM:C.RED_GEM;
    ctx.beginPath();
    ctx.moveTo(0, -8); ctx.lineTo(6, 0); ctx.lineTo(0, 8);
    ctx.lineTo(-6, 0); ctx.closePath(); ctx.fill();

    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(0, -8); ctx.lineTo(0, 0); ctx.lineTo(-6, 0); ctx.closePath(); ctx.fill();

    // Sparkle
    ctx.fillStyle = C.GEM_GLOW;
    ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// SECTION 7: Camera
// ============================================================
class Camera {
  constructor(w, h, mapW, mapH) {
    this.width = w; this.height = h;
    this.mapW = mapW; this.mapH = mapH;
    this.x = 0; this.y = 0;
  }
  update(players) {
    // Target midpoint of alive players
    let cx = 0, cy = 0, count = 0;
    for (const p of players) {
      if (!p.alive) continue;
      cx += p.x + p.w/2; cy += p.y + p.h/2; count++;
    }
    if (count > 0) { cx /= count; cy /= count; }
    else { cx = this.mapW/2; cy = this.mapH/2; }

    const targetX = cx - this.width/2;
    const targetY = cy - this.height/2 + 30; // slight offset for HUD
    this.x += (targetX - this.x) * 0.12;
    this.y += (targetY - this.y) * 0.12;
    this.x = Math.max(0, Math.min(this.x, this.mapW - this.width));
    this.y = Math.max(0, Math.min(this.y, this.mapH - this.height));
  }
}

function drawRoundedButton(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);

  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

  ctx.fillStyle = 'rgba(255,255,255,0.6)';

}

// ============================================================
// SECTION 9: Game State Machine
// ============================================================
class Game {
  constructor() {
    this.state = 'MENU';
    this.currentLevel = 0;
    this.maxLevelUnlocked = 0;
    this.map = null;
    this.players = [];
    this.camera = null;
    this.input = new InputHandler();
    this.audio = new AudioEngine();
    this.particles = [];
    this.time = 0;
    this.deathTimer = 0;
    this.completeTimer = 0;
    this._menuButtons = [];
    this._lastTimestamp = 0;

    // Click handler for menus
    canvas.addEventListener('click', (e) => this._onClick(e));
    canvas.addEventListener('touchend', (e) => {
      const rect = canvas.getBoundingClientRect();
      const sx = LOGICAL_W / rect.width;
      const sy = LOGICAL_H / rect.height;
      for (const t of e.changedTouches) {
        const tx = (t.clientX - rect.left) * sx;
        const ty = (t.clientY - rect.top) * sy;
        this._handleMenuClick(tx, ty);
      }
    });

    // Load saved progress
    try {
      const saved = localStorage.getItem('bubuYier_progress');
      if (saved !== null) this.maxLevelUnlocked = parseInt(saved) || 0;
    } catch(e) {}

    // Initial map
    this._loadLevel(this.currentLevel);
    this.camera = new Camera(LOGICAL_W, LOGICAL_H, this.map.pixelW, this.map.pixelH);

    this._loop = this._loop.bind(this);
    this._lastTimestamp = performance.now();
    requestAnimationFrame(this._loop);
  }

  _loadLevel(idx) {
    this.currentLevel = idx;
    const lvlData = LEVELS[idx];
    this.map = new GameMap(lvlData);
    this.players = [
      new Player('一二', 'water', this.map.spawnYier.x, this.map.spawnYier.y),
      new Player('布布', 'fire', this.map.spawnBubu.x, this.map.spawnBubu.y),
    ];
    if (this.camera) {
      this.camera.mapW = this.map.pixelW;
      this.camera.mapH = this.map.pixelH;
    }
    this.particles = [];
    this.deathTimer = 0;
    this.completeTimer = 0;
  }

  resetLevel() {
    this._loadLevel(this.currentLevel);
  }

  _onClick(e) {
    this.audio.init();
    const rect = canvas.getBoundingClientRect();
    const sx = LOGICAL_W / rect.width;
    const sy = LOGICAL_H / rect.height;
    const mx = (e.clientX - rect.left) * sx;
    const my = (e.clientY - rect.top) * sy;
    this._handleMenuClick(mx, my);
  }

  _handleMenuClick(mx, my) {
    this.audio.init();
    for (const btn of this._menuButtons) {
      if (mx >= btn.x && mx <= btn.x+btn.w && my >= btn.y && my <= btn.y+btn.h) {
        this.audio.menu();
        switch (btn.action) {
          case 'start': this.state = 'PLAYING'; this._loadLevel(this.currentLevel); break;
          case 'levelSelect': this.state = 'LEVEL_SELECT'; break;
          case 'loadLevel': this.state = 'PLAYING'; this._loadLevel(btn.level); break;
          case 'menu': this.state = 'MENU'; break;
        }
        break;
      }
    }
  }

  _loop(timestamp) {
    let dt = Math.min((timestamp - this._lastTimestamp) / 16.667, 3);
    if (isNaN(dt) || dt <= 0) dt = 1;
    this._lastTimestamp = timestamp;
    this.time += dt;

    this.input.clearJustPressed();

    switch (this.state) {
      case 'MENU':
      case 'LEVEL_SELECT':
        break;
      case 'PLAYING':
        this._update(dt);
        break;
      case 'DEAD':
        this.deathTimer -= dt;
        if (this.deathTimer <= 0) this.resetLevel(), this.state = 'PLAYING';
        this.particles.forEach(p=>p.update());
        this.particles = this.particles.filter(p=>p.alive);
        break;
      case 'LEVEL_COMPLETE':
        this.completeTimer -= dt;
        if (this.completeTimer <= 0) {
          if (this.currentLevel < LEVELS.length - 1) {
            this.currentLevel++;
            if (this.currentLevel > this.maxLevelUnlocked) {
              this.maxLevelUnlocked = this.currentLevel;
              try { localStorage.setItem('bubuYier_progress', this.maxLevelUnlocked); } catch(e) {}
            }
            this._loadLevel(this.currentLevel);
            this.state = 'PLAYING';
          } else {
            this.state = 'GAME_COMPLETE';
            this.maxLevelUnlocked = LEVELS.length - 1;
            try { localStorage.setItem('bubuYier_progress', this.maxLevelUnlocked); } catch(e) {}
          }
        }
        this.particles.forEach(p=>p.update());
        this.particles = this.particles.filter(p=>p.alive);
        break;
      case 'GAME_COMPLETE':
        break;
    }

    // Pause toggle
    if (this.input.wasPressed('Escape')) {
      if (this.state === 'PLAYING') this.state = 'PAUSED';
      else if (this.state === 'PAUSED') this.state = 'PLAYING';
    }
    // Restart
    if (this.input.wasPressed('KeyR')) {
      if (this.state === 'PLAYING' || this.state === 'PAUSED') { this.resetLevel(); this.state = 'PLAYING'; }
    }

    this._render();
    requestAnimationFrame(this._loop);
  }

  _update(dt) {
    this.map.update(this.time, this.players, this.particles);

    for (const p of this.players) p.update(this.map, this.players[0]===p?this.players[1]:this.players[0], this.input, this.particles);

    // Update particles
    this.particles.forEach(p=>p.update());
    this.particles = this.particles.filter(p=>p.alive);
    if (this.particles.length > 150) this.particles.splice(0, this.particles.length-150);

    // Check deaths
    let anyDead = false;
    for (const p of this.players) {
      if (!p.alive) { anyDead = true; break; }
    }
    if (anyDead) {
      this.audio.die();
      this.deathTimer = 50;
      this.state = 'DEAD';
      return;
    }

    // Check level complete (both at doors)
    const yierAtDoor = this.players[0].atDoor;
    const bubuAtDoor = this.players[1].atDoor;
    if (yierAtDoor && bubuAtDoor) {
      for (const d of this.map.doors) {
        if (d.active) spawnParticles(this.particles, d.x+d.w/2, d.y+d.h/2, 25, d.type==='yier'?'#aaddff':'#ffaa66', 4, 30, 2.5);
      }
      this.audio.complete();
      this.completeTimer = 100;
      this.state = 'LEVEL_COMPLETE';
    }

    // Update camera
    this.camera.update(this.players);
  }

  _render() {
    ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

    // Background
    ctx.fillStyle = C.BG;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    // Grid pattern
    ctx.strokeStyle = C.BG_GRID;
    ctx.lineWidth = 0.5;
    const gridOffX = -this.camera.x % TILE;
    const gridOffY = -this.camera.y % TILE;
    for (let x = gridOffX; x < LOGICAL_W; x += TILE) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, LOGICAL_H); ctx.stroke();
    }
    for (let y = gridOffY; y < LOGICAL_H; y += TILE) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(LOGICAL_W, y); ctx.stroke();
    }

    // Render map
    if (this.map && (this.state==='PLAYING'||this.state==='DEAD'||this.state==='LEVEL_COMPLETE'||this.state==='PAUSED')) {
      this.map.render(ctx, this.camera, this.time);
    }

    // Render particles
    for (const p of this.particles) {
      const hex = p.color;
      const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
      ctx.fillStyle = `rgba(${r},${g},${b},${p.alpha})`;
      ctx.beginPath(); ctx.arc(p.x-this.camera.x, p.y-this.camera.y, p.size, 0, Math.PI*2); ctx.fill();
    }

    // Render players
    if (this.map && (this.state==='PLAYING'||this.state==='DEAD'||this.state==='LEVEL_COMPLETE'||this.state==='PAUSED')) {
      for (const p of this.players) p.render(ctx, this.camera, this.time);
    }

    // UI overlays
    switch (this.state) {
      case 'MENU': drawMenu(ctx, this); break;
      case 'LEVEL_SELECT': drawLevelSelect(ctx, this); break;
      case 'PLAYING': drawHUD(ctx, this, this.time); drawMobileControls(ctx, this); break;
      case 'PAUSED': drawHUD(ctx, this, this.time); drawPause(ctx); break;
      case 'DEAD': drawHUD(ctx, this, this.time); drawDeath(ctx, this.deathTimer); break;
      case 'LEVEL_COMPLETE': drawHUD(ctx, this, this.time); drawLevelComplete(ctx, this); break;
      case 'GAME_COMPLETE': drawGameComplete(ctx); break;
    }
  }
}

// ============================================================
// SECTION 10: Bootstrap
// ============================================================
function resizeCanvas() {
  const maxW = window.innerWidth;
  const maxH = window.innerHeight;
  const scale = Math.min(maxW / LOGICAL_W, maxH / LOGICAL_H);
  canvas.style.width = (LOGICAL_W * scale) + 'px';
  canvas.style.height = (LOGICAL_H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));
resizeCanvas();

// Start game on first interaction for audio unlock
